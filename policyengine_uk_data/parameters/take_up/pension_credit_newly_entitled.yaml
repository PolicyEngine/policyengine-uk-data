description: Probability that a benefit unit with no Pension Credit entitlement in the calibration year claims it once a reform or a later year entitles it. Set to DWP's caseload take-up of Savings Credit-only awards (Great Britain), the group with the smallest awards, which is closest to what a reform gives the units it newly entitles.
metadata:
  label: Pension Credit take-up for newly entitled units
  name: PC_takeup_newly_entitled
  unit: /1

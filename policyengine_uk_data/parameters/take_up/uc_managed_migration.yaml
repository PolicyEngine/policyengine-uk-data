description: >-
  Households sent a Move to Universal Credit migration notice in Great Britain
  (July 2022 to end of March 2026), by the legacy benefits they received and
  whether they claimed Universal Credit. The claim rate for a combination is
  claimed / (claimed + did_not_claim): the 538 households still in progress
  are left out. Combinations DWP does not report use the all-households row.
  "esa_income" is Stat-Xplore's "Employment Support Allowance"; notices go only
  to claimants of an existing benefit, which is income-related ESA.
metadata:
  unit: /1
  label: Move to Universal Credit claim rate by legacy benefit combination
  reference:
    - title: >-
        DWP Stat-Xplore, "Households invited to Move to Universal Credit",
        table "MtUC Households 3 - Migration notices by legacy benefit and
        move status" (retrieved 2026-10-03)
      href: https://stat-xplore.dwp.gov.uk
    - title: "DWP: Move to Universal Credit, July 2022 to end March 2026 (12 May 2026)"
      href: https://www.gov.uk/government/statistics/move-to-universal-credit-july-2022-to-end-march-2026
# Benefit names follow the order child_tax_credit, working_tax_credit,
# housing_benefit, esa_income, income_support, jsa_income, joined by "+".

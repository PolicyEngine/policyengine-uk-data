# Calibration targets allowed to stay out of the national loss matrix, or to
# enter it with no signal. targets/coverage.py fails the build on any other
# target that is dropped (a name already taken, no value for the year, no
# column, an error), has a non-finite value or column, or has a column no
# household contributes to.
#
# Each entry names the exact targets, the one status they may have, why and
# the issue that tracks removing them. Errors and non-finite values are never
# allowed. An entry applies to every build unless `builds` limits it to
# testing builds (pull requests, TESTING=1) or release builds. A
# testing-only entry may name `patterns` instead, fnmatch globs over target
# names, for targets whose status varies from one testing build to the next.
# A named target that no longer has its status, or a pattern that matches
# no target at all, is reported as stale: remove it.
#
# Measured on uk-data 1.58.1 (enhanced_frs_2024_25.h5, sha256 056e80fd) with
# policyengine-uk 2.122.2 at the calibration year 2025, with #557 and #604,
# as a release build and as a testing build: the registry offers 658 names.
# 643 enter the matrix, 15 have no value for 2025 and 17 of those entering
# have no signal. 3 more targets reuse a name already taken and are dropped
# as duplicates (661 targets in all).
schema_version: 1
gaps:
  - status: zero_signal
    reason: >-
      DIAGNOSTIC ONLY, on the batch-3 leave-one-out branch b3/attrib-no604-seeded
      (uk-data #612), never for release. With #604 reverted, the ONS 85-90 age
      targets enter the matrix, but the FRS top-codes age at 80, so no household
      contributes to them, as on main before #604. This lets the release build
      without #604 for the fit attribution of #608.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/pull/608
    targets:
      - ons/female_85_90
      - ons/male_85_90
  - status: no_value_for_year
    reason: >-
      Dated 2026 only. The calibration year is 2025, and _resolve_value does
      not carry a later year back.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/issues/456
    targets:
      - dwp/uc/two_child_limit/3_children_households
      - dwp/uc/two_child_limit/3_children_households_total_children
      - dwp/uc/two_child_limit/4_children_households
      - dwp/uc/two_child_limit/4_children_households_total_children
      - dwp/uc/two_child_limit/5_children_households
      - dwp/uc/two_child_limit/5_children_households_total_children
      - dwp/uc/two_child_limit/6_children_households
      - dwp/uc/two_child_limit/6_children_households_total_children
      - dwp/uc/two_child_limit/adult_pip_children
      - dwp/uc/two_child_limit/adult_pip_households
      - dwp/uc/two_child_limit/children_affected
      - dwp/uc/two_child_limit/children_in_affected_households
      - dwp/uc/two_child_limit/disabled_child_element_children
      - dwp/uc/two_child_limit/disabled_child_element_households
      - dwp/uc/two_child_limit/households_affected
  - status: duplicate
    reason: >-
      ons_demographics emits these names twice. The matrix keeps the national
      ons/uk_population and the region Scottish targets. It drops a region
      ons/uk_population read from demographics.csv 1,000 times too small, and
      NRS country copies of the Scottish targets with identical values.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/issues/605
    targets:
      - ons/scotland_babies_under_1
      - ons/scotland_children_under_16
      - ons/uk_population
  - status: zero_signal
    reason: >-
      Fewer than 10 records have total income of £1m or more, and they have self-employment income only, so the band's targets for every other income type have no signal.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/issues/593
    targets:
      - hmrc/dividend_income_count_income_band_1_000_000_to_inf
      - hmrc/dividend_income_income_band_1_000_000_to_inf
      - hmrc/employment_income_count_income_band_1_000_000_to_inf
      - hmrc/employment_income_income_band_1_000_000_to_inf
      - hmrc/private_pension_income_count_income_band_1_000_000_to_inf
      - hmrc/private_pension_income_income_band_1_000_000_to_inf
      - hmrc/property_income_count_income_band_1_000_000_to_inf
      - hmrc/property_income_income_band_1_000_000_to_inf
      - hmrc/state_pension_count_income_band_1_000_000_to_inf
      - hmrc/state_pension_income_band_1_000_000_to_inf
  - status: zero_signal
    reason: >-
      No band-H household in these regions.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/issues/593
    targets:
      - voa/council_tax/NORTH_EAST/H
      - voa/council_tax/NORTH_WEST/H
      - voa/council_tax/YORKSHIRE/H
  - status: zero_signal
    reason: >-
      impute_student_loan_plan (datasets/imputations/student_loans.py) assigns
      only NONE, PLAN_1, PLAN_2 and PLAN_5, never POSTGRADUATE, so no record
      has a postgraduate loan in any build.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/issues/593
    targets:
      - slc/student_loan_repayment/england/postgraduate
  - status: zero_signal
    reason: >-
      No couple without children receives UC payments above £27,600 a year.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/issues/593
    targets:
      - dwp/uc_payment_dist/COUPLE_NO_CHILDREN_annual_payment_27_600_to_28_800
      - dwp/uc_payment_dist/COUPLE_NO_CHILDREN_annual_payment_28_800_to_30_000
      - dwp/uc_payment_dist/COUPLE_NO_CHILDREN_annual_payment_30_000_to_inf
  - status: zero_signal
    reason: >-
      In pull request (TESTING) builds the UC payment bands with no signal
      vary from one build to the next, and builds of the same code take one of
      two pre-calibration states (#598). Those builds hold one output-area
      clone of each household (PE_UK_DATA_OA_CLONES=1, as release builds do).
      Of 21 pull request builds from 8 to 15 October 2026, the national
      estimate in the final calibration log was exactly zero for
      COUPLE_NO_CHILDREN 27,600 to 28,800 in 20, and 28,800 to 30,000 and
      30,000 and over in all 21; SINGLE 24,000 to 25,200 and 25,200 to 26,400
      in 20, and 27,600 to 28,800 in all 21; and COUPLE_WITH_CHILDREN 27,600
      to 28,800 in 3. The gate failed on the three SINGLE bands in run
      38726993359 and on the COUPLE_WITH_CHILDREN band in run 38732018053. In
      release builds only the three COUPLE_NO_CHILDREN bands above may lack
      signal.
    issue: https://github.com/PolicyEngine/policyengine-uk-data/issues/598
    builds: [testing]
    patterns:
      - "dwp/uc_payment_dist/*"

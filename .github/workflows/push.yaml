# After successful versioning, this script runs various 
# parts of the push process
name: Push

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

jobs:
  # A merge that touches pyproject.toml and also adds changelog fragments is
  # followed by versioning's "Update package version" commit, whose own Push
  # run builds and publishes the bumped version. Building the merge commit as
  # well spent about 1.5 hours on a version that was never released (run
  # 37642619160 on 2026-10-07 was cancelled by hand). This job decides whether
  # to build: always for the version commit and for manual runs, never for a
  # push that changed changelog.d, and otherwise as before.
  gate:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ] || [ "$MESSAGE" = "Update package version" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" --jq '.files[].filename'); then
            echo "::warning::Could not list this push's files; building as before."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -q '^changelog\.d/'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build deferred to versioning::This push adds changelog fragments, so the versioning workflow bumps the version and the Push run on its 'Update package version' commit builds and publishes."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  lint:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.9.0"
      - name: Check formatting
        run: ruff format --check .
  test:
    name: Build and test
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Successful runs since July took 77 to 125 minutes end to end. Fail a hung build
    # instead of holding a shared org runner for GitHub's 6-hour default.
    timeout-minutes: 240
    permissions:
      contents: "write"
      # Required to auth against gcp
      id-token: "write"
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PE_UK_DATA_OA_CLONES: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
          service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - name: Download data inputs
        run: uv run --frozen make download
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      - name: Build datasets
        run: uv run --frozen make data
      - name: Save calibration log (constituencies)
        uses: actions/upload-artifact@v7
        with:
          name: constituency_calibration_log.csv
          path: constituency_calibration_log.csv
      
      - name: Save calibration log (local authorities)
        uses: actions/upload-artifact@v7
        with:
          name: la_calibration_log.csv
          path: la_calibration_log.csv
      - name: Run tests
        run: uv run --frozen make test
      - name: Upload data
        run: uv run --frozen make upload
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      - name: Publish a git tag
        run: ".github/publish-git-tag.sh"

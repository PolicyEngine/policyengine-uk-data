# After successful versioning, this script runs various 
# parts of the push process
name: Push

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

# One Push run at a time. Two builds that overlap both write the unversioned
# copies of a release (the files at the root of the Hugging Face repo and the
# GCS objects, both named by file), so whichever finishes last wins, even if
# it is the older version. A plain group lets a newer run replace one that is
# still pending, which could discard a version commit's release; #553 dropped
# the group for that reason. `queue: max` keeps every waiting run (up to 100)
# instead, and concurrency never cancels a build that has started.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  # A merge that touches pyproject.toml and also adds changelog fragments is
  # followed by versioning's "Update package version" commit, whose own Push
  # run builds and publishes the bumped version. Building the merge commit as
  # well spent about 1.5 hours on a version that was never released (run
  # 37642619160 on 2026-10-07 was cancelled by hand). This job decides whether
  # to build: never for a push that changed changelog.d (other than the version
  # commit), and never for a push whose pyproject.toml version already has a
  # git tag. publish-git-tag.sh pushes that tag only after the data uploaded,
  # and data_upload.py raises rather than change a release that is final on
  # Hugging Face unless the rebuilt manifest equals the published one. Building
  # such a push would spend about 1.5 hours and release nothing new. Otherwise
  # it builds as before, and a manual run always builds.
  gate:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /pyproject.toml
            /.github/fetch_version.py
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "$EVENT" = "push" ] && [ "$MESSAGE" != "Update package version" ]; then
            if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" --jq '.files[].filename'); then
              echo "::warning::Could not list this push's files; building as before."
            elif printf '%s\n' "$files" | grep -q '^changelog\.d/'; then
              build=false
              echo "::notice title=Build deferred to versioning::This push adds changelog fragments, so the versioning workflow bumps the version and the Push run on its 'Update package version' commit builds and publishes."
            fi
          fi
          if [ "$build" = true ] && [ "$EVENT" = "push" ]; then
            version=$(python3 .github/fetch_version.py) || version=
            if [ -z "$version" ] || [ "$version" = None ]; then
              echo "::warning::Could not read the version from pyproject.toml; building as before."
            else
              status=0
              git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null || status=$?
              if [ "$status" -eq 0 ]; then
                build=false
                echo "::notice title=Already released::Version ${version} already has a git tag, so its data is already published. Add a changelog fragment to release a new version, or run this workflow manually to rebuild this one."
              elif [ "$status" -ne 2 ]; then
                echo "::warning::Could not check for tag ${version}; building as before."
              fi
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
  lint:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.9.0"
      - name: Check formatting
        run: ruff format --check .
  test:
    name: Build and test
    # Waiting for Lint means a formatting failure stops the release before it
    # builds or uploads anything. Lint's checks take about 10 seconds.
    needs: [gate, lint]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Successful runs since July took 77 to 125 minutes end to end. Fail a hung build
    # instead of holding a shared org runner for GitHub's 6-hour default.
    timeout-minutes: 240
    permissions:
      contents: "write"
      # Required to auth against gcp
      id-token: "write"
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PE_UK_DATA_OA_CLONES: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        # Restore uv's package cache but never save one from a job that
        # holds the data: its location can be moved (UV_CACHE_DIR).
        with:
          save-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
          service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - name: Download data inputs
        run: uv run --frozen make download
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      - name: Build datasets
        run: uv run --frozen make data
      # The raw calibration logs stay on the runner. They hold every target's
      # weighted estimate at every logged epoch with no small-cell control, so a
      # target supported by a few households, divided by a published count,
      # could give one household's value back, and this repository's
      # artifacts are public.
      - name: Run tests
        run: uv run --frozen make test
      - name: Upload data
        run: uv run --frozen make upload
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      - name: Publish a git tag
        run: ".github/publish-git-tag.sh"
      # policyengine.py qualifies every new data release against the latest
      # model before it can be promoted (certify-uk-release.yaml). Tell it now
      # rather than leave it to its two-hourly schedule. This runs only after
      # the data uploaded and the tag was published; a duplicate dispatch for
      # a version already qualified is a no-op there.
      - name: Generate a token for policyengine.py
        id: qualification-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PolicyEngine
          repositories: policyengine.py
          # A repository dispatch needs contents: write and nothing else.
          permission-contents: write
      - name: Ask policyengine.py to qualify this release
        env:
          GH_TOKEN: ${{ steps.qualification-token.outputs.token }}
        run: |
          version=$(python3 .github/fetch_version.py)
          if [ -z "$version" ] || [ "$version" = None ]; then
            echo "::error::Could not read the released version from pyproject.toml."
            exit 1
          fi
          # publish-git-tag.sh ignores a failed tag push, so check the tag is
          # really on origin before announcing the release.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null; then
            echo "::error::Tag ${version} is not on origin, so the release is not published; not asking policyengine.py to qualify it."
            exit 1
          fi
          gh api --method POST repos/PolicyEngine/policyengine.py/dispatches \
            -f event_type=policyengine-uk-data-release \
            -f "client_payload[version]=${version}"
          echo "Asked policyengine.py to qualify policyengine-uk-data ${version}."

name: Changelog entry

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-changelog:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # The pull request's merge commit and its first parent, the tip of
          # main, so the check sees exactly what merging would change.
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Check for a typed changelog fragment
        run: python .github/check_changelog_fragment.py HEAD^1 HEAD
